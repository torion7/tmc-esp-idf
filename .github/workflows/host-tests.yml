name: Host-Tests

# Referenzvektor-Tests der IDF-freien tmc_motion-Quellen (Register-
# Dekodierung + Einheiten-Umrechnung) — nur gcc, kein ESP-IDF noetig.

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests bauen und ausfuehren
        run: make -C host_tests
